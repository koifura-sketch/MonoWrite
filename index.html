<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemoWrite — 筆記型・記憶定着単語帳</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            mastery: {
              unlearned: '#94a3b8', // slate-400
              weak: '#f59e0b',      // amber-500
              learning: '#3b82f6',  // blue-500
              mastered: '#10b981',  // emerald-500
            }
          },
          animation: {
            'shake': 'shake 0.35s cubic-bezier(.36,.07,.19,.97) both',
            'pop': 'pop 0.25s ease-out forwards',
          },
          keyframes: {
            shake: {
              '10%, 90%': { transform: 'translate3d(-2px, 0, 0)' },
              '20%, 80%': { transform: 'translate3d(4px, 0, 0)' },
              '30%, 50%, 70%': { transform: 'translate3d(-6px, 0, 0)' },
              '40%, 60%': { transform: 'translate3d(6px, 0, 0)' }
            },
            pop: {
              '0%': { transform: 'scale(0.95)', opacity: '0.6' },
              '100%': { transform: 'scale(1)', opacity: '1' }
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.6);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200 selection:bg-indigo-500 selection:text-white">

  <!-- Toast Notification Container (Replaces alert) -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-30 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <!-- Brand Logo -->
      <button onclick="app.navigate('home')" class="flex items-center gap-2.5 group focus:outline-none">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-teal-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform">
          <i data-lucide="pen-tool" class="w-5 h-5"></i>
        </div>
        <div class="text-left">
          <span class="font-extrabold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-teal-600 dark:from-indigo-400 dark:to-teal-400">MemoWrite</span>
          <span class="hidden sm:inline-block ml-1.5 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">筆記記憶帳</span>
        </div>
      </button>

      <!-- Header Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Cloud Account Sync Button -->
        <button id="header-account-btn" onclick="app.openAccountModal()" class="inline-flex items-center gap-2 px-3 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200/70 dark:border-indigo-800/70 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 transition-colors" title="アカウントログイン・クラウド同期">
          <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-slate-400 shrink-0"></span>
          <i data-lucide="user-check" class="w-4 h-4 shrink-0"></i>
          <span id="header-account-label" class="max-w-[110px] truncate">ログイン / 同期</span>
        </button>

        <!-- Backup / Restore Menu Button -->
        <button onclick="app.openBackupModal()" class="inline-flex items-center gap-1.5 px-3 py-2 text-xs sm:text-sm font-medium rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="データのバックアップ・復元">
          <i data-lucide="database" class="w-4 h-4"></i>
          <span class="hidden md:inline">データ管理</span>
        </button>

        <!-- Dark Mode Toggle -->
        <button onclick="app.toggleDarkMode()" class="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="テーマ切り替え">
          <i id="theme-icon-dark" data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
          <i id="theme-icon-light" data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="app-main" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <!-- Dynamic Views Rendered Here -->
  </main>

  <!-- Generic Modal Backdrop -->
  <div id="modal-backdrop" class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 transition-opacity">
    <div id="modal-content" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto animate-pop">
      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <script>
    /**
     * MemoWrite - Monoxer-inspired Typing Vocabulary App
     * Data Structure, Per-User Cloud Sync & State Management
     */
    const STORAGE_KEY = 'memowrite_v1_data';
    const THEME_KEY = 'memowrite_v1_theme';
    const ACCOUNT_KEY = 'memowrite_v1_account';
    const DBURL_KEY = 'memowrite_v1_dburl';

    // Pre-configured Firebase Project (monowrite-3b828)
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBYpUTtUBoiSzAdx52GY1ouv_v1_lgChgo",
      authDomain: "monowrite-3b828.firebaseapp.com",
      projectId: "monowrite-3b828",
      storageBucket: "monowrite-3b828.firebasestorage.app",
      messagingSenderId: "815622335518",
      appId: "1:815622335518:web:08f1ed0d4dfa99fb72920f",
      databaseURL: "https://monowrite-3b828-default-rtdb.firebaseio.com"
    };

    // Default sample decks for immediate testing
    const DEFAULT_DATA = {
      books: [
        {
          id: 'book_sample_1',
          title: 'システム英単語・基礎コア',
          description: '大学受験・日常頻出の基本動詞・名詞セット。日⇔英の双方向筆記で確実に定着させましょう。',
          color: 'indigo',
          updatedAt: Date.now(),
          words: [
            { id: 'w1', en: 'accomplish', ja: '成し遂げる、達成する', masteryEnToJa: 100, masteryJaToEn: 80, streak: 3 },
            { id: 'w2', en: 'determine', ja: '決定する、決心する', masteryEnToJa: 80, masteryJaToEn: 40, streak: 1 },
            { id: 'w3', en: 'maintain', ja: '維持する、主張する', masteryEnToJa: 60, masteryJaToEn: 0, streak: 0 },
            { id: 'w4', en: 'significant', ja: '重要な、著しい', masteryEnToJa: 40, masteryJaToEn: 0, streak: 0 },
            { id: 'w5', en: 'environment', ja: '環境', masteryEnToJa: 100, masteryJaToEn: 100, streak: 5 },
            { id: 'w6', en: 'opportunity', ja: '機会、チャンス', masteryEnToJa: 20, masteryJaToEn: 0, streak: 0 },
            { id: 'w7', en: 'essential', ja: '不可欠な、本質的な', masteryEnToJa: 0, masteryJaToEn: 0, streak: 0 },
            { id: 'w8', en: 'persuade', ja: '説得する', masteryEnToJa: 0, masteryJaToEn: 0, streak: 0 },
          ]
        },
        {
          id: 'book_sample_2',
          title: 'ビジネス・IT必須英単語',
          description: '開発現場やミーティングでそのまま使える実践的な語彙ブック。',
          color: 'teal',
          updatedAt: Date.now() - 3600000,
          words: [
            { id: 'b1', en: 'implement', ja: '実装する、実行する', masteryEnToJa: 80, masteryJaToEn: 60, streak: 2 },
            { id: 'b2', en: 'alternative', ja: '代替案、代わりの', masteryEnToJa: 40, masteryJaToEn: 20, streak: 1 },
            { id: 'b3', en: 'efficient', ja: '効率的な', masteryEnToJa: 100, masteryJaToEn: 80, streak: 3 },
            { id: 'b4', en: 'collaborate', ja: '協力する、共同作業する', masteryEnToJa: 0, masteryJaToEn: 0, streak: 0 },
            { id: 'b5', en: 'requirement', ja: '要件、必要条件', masteryEnToJa: 20, masteryJaToEn: 0, streak: 0 },
          ]
        }
      ]
    };

    class MemoWriteApp {
      constructor() {
        this.state = this.loadState();
        this.view = 'home'; // 'home' | 'book' | 'study'
        this.activeBookId = null;
        this.searchQuery = '';
        this.studySession = null;

        // Cloud Sync Properties
        this.db = null;
        this.userRef = null;
        this.account = null; // { username, userKey }
        this.isApplyingRemote = false;

        this.initTheme();
        this.initFirebase();
        this.restoreSavedAccount();
        this.render();
      }

      // ==========================================
      // FIREBASE & PER-ACCOUNT CLOUD SYNC
      // ==========================================
      getDatabaseURL() {
        return localStorage.getItem(DBURL_KEY) || FIREBASE_CONFIG.databaseURL;
      }

      initFirebase() {
        try {
          if (typeof firebase === 'undefined') return;
          const config = {
            ...FIREBASE_CONFIG,
            databaseURL: this.getDatabaseURL()
          };
          if (!firebase.apps.length) {
            firebase.initializeApp(config);
          }
          this.db = firebase.database();
        } catch (e) {
          console.error('Firebase initialization failed:', e);
          this.updateSyncUI('error', '未接続');
        }
      }

      async deriveUserKey(username, password) {
        const normalized = `${username.trim().toLowerCase()}::${password}`;
        const buf = new TextEncoder().encode(normalized);
        const hash = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hash))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('')
          .slice(0, 32);
      }

      restoreSavedAccount() {
        try {
          const raw = localStorage.getItem(ACCOUNT_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.username && parsed.userKey) {
              this.connectAccount(parsed.username, parsed.userKey, false);
              return;
            }
          }
        } catch (e) {}
        this.updateSyncUI('offline', 'ログイン / 同期');
      }

      connectAccount(username, userKey, isFreshLogin = false) {
        this.account = { username, userKey };
        this.updateSyncUI('syncing', `${username} (同期中...)`);

        if (!this.db) {
          this.updateSyncUI('error', `${username} (DB未接続)`);
          return;
        }

        if (this.userRef) {
          this.userRef.off();
        }

        this.userRef = this.db.ref(`memowrite_users/${userKey}/state`);
        this.userRef.on('value', (snapshot) => {
          const remoteState = snapshot.val();
          if (remoteState && Array.isArray(remoteState.books)) {
            this.isApplyingRemote = true;
            // Ensure words array exists on each book (Firebase drops empty arrays)
            remoteState.books = remoteState.books.map(b => ({
              ...b,
              words: Array.isArray(b.words) ? b.words : []
            }));
            this.state = remoteState;
            this.saveLocalOnly();
            // Do not interrupt active typing input while studying
            if (this.view !== 'study') {
              this.render();
            }
            this.isApplyingRemote = false;
          } else if (isFreshLogin) {
            // New account on cloud: upload current local books as initial state
            this.pushCloudState();
          }
          this.updateSyncUI('connected', username);
        }, (err) => {
          console.error('Firebase sync error:', err);
          this.updateSyncUI('error', '同期エラー');
          this.showToast('クラウド同期エラーが発生しました（DBのURLまたはルールを確認してください）', 'error');
        });
      }

      logoutAccount() {
        if (this.userRef) {
          this.userRef.off();
          this.userRef = null;
        }
        this.account = null;
        localStorage.removeItem(ACCOUNT_KEY);
        this.updateSyncUI('offline', 'ログイン / 同期');
        this.closeModal();
        this.showToast('ログアウトしました（ローカル保存モードに切り替わりました）', 'info');
      }

      updateSyncUI(status, labelText) {
        const dot = document.getElementById('sync-status-dot');
        const label = document.getElementById('header-account-label');
        if (label) label.textContent = labelText;
        if (!dot) return;

        dot.className = 'w-2 h-2 rounded-full shrink-0 ';
        if (status === 'connected') {
          dot.className += 'bg-emerald-500';
        } else if (status === 'syncing') {
          dot.className += 'bg-amber-400 animate-pulse';
        } else if (status === 'error') {
          dot.className += 'bg-rose-500';
        } else {
          dot.className += 'bg-slate-400';
        }
      }

      openAccountModal() {
        const isLoggedIn = Boolean(this.account);
        const currentDbUrl = this.getDatabaseURL();

        this.openModal(`
          <div class="p-6">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <i data-lucide="cloud" class="w-5 h-5 text-indigo-500"></i>
                アカウント同期設定
              </h3>
              <button onclick="app.closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <p class="text-xs text-slate-600 dark:text-slate-400 mb-4 leading-relaxed">
              <strong>アカウント名</strong>と<strong>パスワード</strong>を設定すると、あなた専用の単語帳と記憶度がクラウドに自動保存され、別のスマホやPCでも同じ情報でログインするだけで同期されます。
            </p>

            ${isLoggedIn ? `
              <div class="p-4 rounded-2xl bg-emerald-50/80 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/70 mb-5 flex items-center justify-between gap-3">
                <div>
                  <div class="text-[11px] font-bold text-emerald-700 dark:text-emerald-400">現在ログイン中・自動同期オン</div>
                  <div class="text-base font-extrabold text-slate-900 dark:text-white mt-0.5">${this.esc(this.account.username)}</div>
                </div>
                <button onclick="app.logoutAccount()" class="px-3.5 py-2 rounded-xl bg-white dark:bg-slate-900 border border-rose-200 dark:border-rose-900 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 text-xs font-bold transition-colors">
                  ログアウト
                </button>
              </div>
            ` : ''}

            <form id="account-sync-form" class="space-y-4">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                  ${isLoggedIn ? '別のアカウントへ切り替え：アカウント名' : 'アカウント名'}
                </label>
                <input type="text" id="sync-username-input" required placeholder="例: taro_vocab"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>

              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                  パスワード（合言葉）
                </label>
                <input type="password" id="sync-password-input" required placeholder="例: 1234abcd"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                <p class="mt-1 text-[11px] text-slate-400">※個人データ識別用です。他サービスと同じ重要なパスワードは使わないでください。</p>
              </div>

              <label class="flex items-center gap-2 text-xs font-medium text-slate-600 dark:text-slate-300 cursor-pointer">
                <input type="checkbox" id="sync-remember-checkbox" checked class="rounded text-indigo-600 focus:ring-indigo-500" />
                この端末でログイン状態を保持する
              </label>

              <details class="pt-2 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-500">
                <summary class="cursor-pointer font-semibold hover:text-slate-700 dark:hover:text-slate-300">詳細設定（Firebase Database URL）</summary>
                <div class="mt-2">
                  <input type="text" id="sync-dburl-input" value="${this.esc(currentDbUrl)}"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono text-[11px] text-slate-700 dark:text-slate-300" />
                </div>
              </details>

              <div class="pt-2 flex items-center justify-end gap-2.5">
                <button type="button" onclick="app.closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">閉じる</button>
                <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm">
                  ログインして自動同期
                </button>
              </div>
            </form>
          </div>
        `);

        document.getElementById('account-sync-form').onsubmit = async (e) => {
          e.preventDefault();
          const username = document.getElementById('sync-username-input').value.trim();
          const password = document.getElementById('sync-password-input').value;
          const remember = document.getElementById('sync-remember-checkbox').checked;
          const newDbUrl = document.getElementById('sync-dburl-input').value.trim().replace(/\/$/, '');

          if (!username || !password) return;

          if (newDbUrl && newDbUrl !== this.getDatabaseURL()) {
            localStorage.setItem(DBURL_KEY, newDbUrl);
          }

          const userKey = await this.deriveUserKey(username, password);
          if (remember) {
            localStorage.setItem(ACCOUNT_KEY, JSON.stringify({ username, userKey }));
          } else {
            localStorage.removeItem(ACCOUNT_KEY);
          }

          if (newDbUrl && newDbUrl !== FIREBASE_CONFIG.databaseURL) {
            location.reload();
            return;
          }

          this.connectAccount(username, userKey, true);
          this.closeModal();
          this.showToast(`「${username}」でクラウド同期を開始しました`, 'success');
        };
      }

      // ==========================================
      // STATE PERSISTENCE (LOCAL + CLOUD)
      // ==========================================
      loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.books)) {
              return parsed;
            }
          }
        } catch (e) {
          console.error('Failed to load state:', e);
        }
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }

      saveLocalOnly() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
        } catch (e) {
          this.showToast('保存に失敗しました（ストレージ容量を確認してください）', 'error');
        }
      }

      pushCloudState() {
        if (this.userRef && this.account && !this.isApplyingRemote) {
          this.updateSyncUI('syncing', `${this.account.username} (保存中...)`);
          this.userRef.set(this.state)
            .then(() => {
              if (this.account) this.updateSyncUI('connected', this.account.username);
            })
            .catch(() => {
              this.updateSyncUI('error', '保存エラー');
            });
        }
      }

      saveState() {
        this.saveLocalOnly();
        this.pushCloudState();
      }

      initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }

      toggleDarkMode() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      }

      // Utility: Generate unique ID
      uid(prefix = 'id') {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).substring(2, 7)}`;
      }

      // Utility: Escape HTML to prevent XSS
      esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Toast notification
      showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const colors = {
          info: 'bg-slate-800 dark:bg-slate-700 text-white border-slate-700',
          success: 'bg-emerald-600 text-white border-emerald-500',
          error: 'bg-rose-600 text-white border-rose-500',
          warning: 'bg-amber-600 text-white border-amber-500'
        };
        const icons = {
          info: 'info',
          success: 'check-circle-2',
          error: 'alert-circle',
          warning: 'alert-triangle'
        };
        toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium animate-pop ${colors[type] || colors.info}`;

        container.appendChild(toast);

      // Calculate Book Mastery Stats (Monoxer-like segmented stats)
      getBookStats(book) {
        const total = book.words.length;
        if (total === 0) {
          return { total: 0, overallPercent: 0, mastered: 0, learning: 0, weak: 0, unlearned: 0 };
        }
        let sumPercent = 0;
        let mastered = 0; // >= 85%
        let learning = 0; // 40% - 84%
        let weak = 0;     // 1% - 39%
        let unlearned = 0;// 0%

        book.words.forEach(w => {
          const avg = Math.round(((w.masteryEnToJa || 0) + (w.masteryJaToEn || 0)) / 2);
          sumPercent += avg;
          if (avg >= 85) mastered++;
          else if (avg >= 40) learning++;
          else if (avg > 0) weak++;
          else unlearned++;
        });

        return {
          total,
          overallPercent: Math.round(sumPercent / total),
          mastered,
          learning,
          weak,
          unlearned
        };
      }

          a.download = `memowrite_backup_${new Date().toISOString().slice(0, 10)}.json`;

        document.getElementById('copy-json-btn').onclick = () => {
          const temp = document.createElement('textarea');

            this.saveState();
            this.closeModal();
            this.navigate('home');
            this.showToast('データを復元しました！', 'success');
          } catch (e) {
            this.showToast('JSONの形式が正しくありません', 'error');
          }
        };
      }

        document.getElementById('start-session-btn').onclick = () => {
          const directionMode = document.querySelector('input[name="study-dir"]:checked').value;
          const scope = document.querySelector('input[name="study-scope"]:checked').value;

          this.startStudySession(directionMode, scope);

      startStudySession(directionMode, scope) {
        const book = this.getActiveBook();
        if (!book || book.words.length === 0) return;

        // Build question queue
        let candidates = [...book.words];
        if (scope === 'smart') {
          // Sort by lowest average mastery first
          candidates.sort((a, b) => {
            const avgA = (a.masteryEnToJa + a.masteryJaToEn) / 2;
            const avgB = (b.masteryEnToJa + b.masteryJaToEn) / 2;
            return avgA - avgB;
          });
          // Take up to 15 prioritized words, then shuffle slightly
          candidates = candidates.slice(0, 15).sort(() => Math.random() - 0.5);
        } else {
          candidates.sort(() => Math.random() - 0.5);
        }

        const queue = [];
        candidates.forEach(word => {
          if (directionMode === 'mix') {
            // Choose weaker direction for this word, or random if equal
            const dir = word.masteryJaToEn < word.masteryEnToJa
              ? 'ja2en'
              : (word.masteryEnToJa < word.masteryJaToEn ? 'en2ja' : (Math.random() < 0.5 ? 'ja2en' : 'en2ja'));
            queue.push({ wordId: word.id, dir, isRetry: false });
          } else {
            queue.push({ wordId: word.id, dir: directionMode, isRetry: false });
          }
        });

        this.studySession = {
          bookId: book.id,
          directionMode,
          scope,
          queue,
          currentIndex: 0,
          hintLevel: 0,
          phase: 'question', // 'question' | 'feedback_correct' | 'feedback_wrong' | 'complete'
          lastUserAnswer: '',
          correctCount: 0,
          wrongCount: 0,
          history: [] // { en, ja, dir, correct, usedHint }
        };

        this.view = 'study';
        this.render();
      }

      // Normalize string for flexible, fair comparison
      normalizeAnswer(str) {
        return str
          .trim()
          .toLowerCase()
          // Convert full-width alphanumeric to half-width
          .replace(/[！-～]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
          // Collapse multiple spaces
          .replace(/\s+/g, ' ');
      }

      // Check if user's typed answer matches expected answer
      checkAnswerMatch(userInput, targetRaw, dir) {
        const normUser = this.normalizeAnswer(userInput);
        if (!normUser) return false;

        if (dir === 'ja2en') {
          // Target is English (support slash or comma variants if entered)
          const variants = targetRaw.split(/[/／,，]/).map(s => this.normalizeAnswer(s)).filter(Boolean);
          return variants.includes(normUser);
        } else {
          // Target is Japanese: allow matching ANY of the meanings separated by 、 , / ・
          const variants = targetRaw
            .split(/[、,，/／・]/)
            .map(s => this.normalizeAnswer(s.replace(/（.*?）|\(.*?\)/g, ''))) // ignore parenthetical notes if user omits them
            .filter(Boolean);
          // Also allow exact match of full string
          variants.push(this.normalizeAnswer(targetRaw));
          return variants.includes(normUser);
        }
      }

      // Generate progressive Monoxer-style masked hint
      getHintText(word, dir, hintLevel) {
        const target = dir === 'ja2en' ? word.en : word.ja.split(/[、,，/／・]/)[0].trim();
        if (hintLevel <= 0) return '';

        const chars = Array.from(target);
        const revealCount = Math.min(chars.length - 1, hintLevel);

        return chars.map((ch, idx) => {
          if (ch === ' ') return '  ';
          if (idx < revealCount) return ch;
          return '＿';
        }).join(' ');
      }

      useHint() {
        if (!this.studySession || this.studySession.phase !== 'question') return;
        this.studySession.hintLevel++;
        this.render();
        const input = document.getElementById('study-answer-input');
        if (input) input.focus();
      }

      submitStudyAnswer(userRaw) {
        const session = this.studySession;
        if (!session) return;
        const book = this.getActiveBook();
        const currentItem = session.queue[session.currentIndex];
        const word = book.words.find(w => w.id === currentItem.wordId);
        if (!word) return;

        const targetRaw = currentItem.dir === 'ja2en' ? word.en : word.ja;

        // If user is in 'feedback_wrong' phase, require typing the correct answer once to reinforce memory!
        if (session.phase === 'feedback_wrong') {
          const isCorrected = this.checkAnswerMatch(userRaw, targetRaw, currentItem.dir);
          if (isCorrected) {
            this.advanceStudyQueue();
          } else {
            const input = document.getElementById('study-retype-input');
            if (input) {
              input.classList.remove('animate-shake');
              void input.offsetWidth; // trigger reflow
              input.classList.add('animate-shake');
              input.value = '';
              input.focus();
            }
            this.showToast('正しいスペル・意味をそのまま入力してください', 'warning');
          }
          return;
        }

        // Normal 'question' phase evaluation
        const isCorrect = this.checkAnswerMatch(userRaw, targetRaw, currentItem.dir);
        session.lastUserAnswer = userRaw;

        const masteryKey = currentItem.dir === 'ja2en' ? 'masteryJaToEn' : 'masteryEnToJa';
        const currentMastery = word[masteryKey] || 0;

        if (isCorrect) {
          // Calculate mastery gain (reduced if hint was used or if it was a retry)
          let gain = 25;
          if (session.hintLevel > 0) gain = 10;
          if (currentItem.isRetry) gain = 10;

          word[masteryKey] = Math.min(100, currentMastery + gain);
          word.streak = (word.streak || 0) + 1;
          session.correctCount++;
          session.phase = 'feedback_correct';

          if (!currentItem.isRetry) {
            session.history.push({
              en: word.en,
              ja: word.ja,
              dir: currentItem.dir,
              correct: true,
              usedHint: session.hintLevel > 0
            });
          }
        } else {
          // Penalty on mistake & re-queue at the end of the session (Monoxer reinforcement loop)
          word[masteryKey] = Math.max(0, currentMastery - 15);
          word.streak = 0;
          session.wrongCount++;
          session.phase = 'feedback_wrong';

          if (!currentItem.isRetry) {
            session.history.push({
              en: word.en,
              ja: word.ja,
              dir: currentItem.dir,
              correct: false,
              usedHint: session.hintLevel > 0
            });
          }

          // Re-insert into queue 2-3 steps later or at the end so user must recall it again
          session.queue.push({
            wordId: word.id,
            dir: currentItem.dir,
            isRetry: true
          });
        }

        book.updatedAt = Date.now();
        this.saveState();
        this.render();
      }

      advanceStudyQueue() {
        const session = this.studySession;
        if (!session) return;

        if (session.currentIndex + 1 < session.queue.length) {
          session.currentIndex++;
          session.hintLevel = 0;
          session.phase = 'question';
          session.lastUserAnswer = '';
        } else {
          session.phase = 'complete';
        }
        this.render();
      }

                <button onclick="app.resetBookMastery()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-amber-600 dark:text-amber-400 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-amber-50 dark:hover:bg-amber-950/30">
                  <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 記憶度リセット
                </button>
              </div>
            </div>

            <!-- Book Header & Mastery Breakdown Card -->
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
                <div class="space-y-2 max-w-2xl">
                  <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                    ${this.esc(book.title)}
                  </h1>
                  <p class="text-sm text-slate-500 dark:text-slate-400">
                    ${book.description ? this.esc(book.description) : '登録単語を編集したり、筆記トレーニングを開始できます。'}
                  </p>
                </div>

                <div class="shrink-0">
                  <button onclick="app.openStudySetupModal()" class="w-full sm:w-auto px-7 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-teal-600 hover:from-indigo-700 hover:to-teal-700 text-white font-bold text-base shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2.5 transition-all hover:scale-[1.02]">
                    <i data-lucide="pen-tool" class="w-5 h-5"></i> 筆記学習をスタート
                  </button>
                </div>
              </div>

              <!-- Segmented Mastery Progress Bar -->
              <div class="mt-7 pt-6 border-t border-slate-100 dark:border-slate-800">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">総合記憶度</span>
                    <span class="text-xl font-extrabold text-indigo-600 dark:text-indigo-400">${stats.overallPercent}%</span>
                  </div>
                  <div class="flex flex-wrap items-center gap-4 text-xs font-semibold">
                    <span class="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400">
                      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 定着済み: ${stats.mastered}
                    </span>
                    <span class="flex items-center gap-1.5 text-blue-600 dark:text-blue-400">
                      <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> 記憶中: ${stats.learning}
                    </span>
                    <span class="flex items-center gap-1.5 text-amber-600 dark:text-amber-400">
                      <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> うろ覚え: ${stats.weak}
                    </span>
                    <span class="flex items-center gap-1.5 text-slate-500 dark:text-slate-400">
                      <span class="w-2.5 h-2.5 rounded-full bg-slate-300 dark:bg-slate-700"></span> 未学習: ${stats.unlearned}
                    </span>
                  </div>
                </div>
                <div class="w-full h-3.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden flex">
                  <div style="width: ${pMastered}%" class="bg-emerald-500 transition-all duration-500"></div>
                  <div style="width: ${pLearning}%" class="bg-blue-500 transition-all duration-500"></div>
                  <div style="width: ${pWeak}%" class="bg-amber-400 transition-all duration-500"></div>
                </div>
              </div>
            </div>

            <!-- Word Management Toolbar -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <!-- Search Input -->
              <div class="relative flex-1 max-w-md">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="word-search-input" value="${this.esc(this.searchQuery)}" placeholder="単語や意味で検索..."
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>

              <!-- Add / Bulk Import Buttons -->
              <div class="flex items-center gap-2.5">
                <button onclick="app.openBulkImportModal()" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 text-sm font-bold transition-colors">
                  <i data-lucide="file-spreadsheet" class="w-4 h-4 text-teal-500"></i> 一括追加
                </button>
                <button onclick="app.openWordModal()" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-sm transition-colors">
                  <i data-lucide="plus" class="w-4 h-4"></i> 単語を追加
                </button>
              </div>
            </div>

            <!-- Words List -->
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
              ${book.words.length === 0 ? `
                <div class="p-12 text-center">
                  <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 mx-auto flex items-center justify-center mb-3">
                    <i data-lucide="file-plus-2" class="w-6 h-6"></i>
                  </div>
                  <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">単語が登録されていません</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">「単語を追加」または「一括追加」から学習したい単語を登録してください。</p>
                  <button onclick="app.openWordModal()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold">
                    最初の単語を追加する
                  </button>
                </div>
              ` : filteredWords.length === 0 ? `
                <div class="p-8 text-center text-sm text-slate-500 dark:text-slate-400">
                  「${this.esc(this.searchQuery)}」に一致する単語はありません。
                </div>
              ` : `
                <div class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${filteredWords.map((w, idx) => {
                    const en2ja = w.masteryEnToJa || 0;
                    const ja2en = w.masteryJaToEn || 0;
                    const avg = Math.round((en2ja + ja2en) / 2);
                    const badgeClass = avg >= 85
                      ? 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-400 dark:border-emerald-800'
                      : avg >= 40
                      ? 'bg-blue-50 text-blue-700 border-blue-200 dark:bg-blue-950/60 dark:text-blue-400 dark:border-blue-800'
                      : avg > 0
                      ? 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/60 dark:text-amber-400 dark:border-amber-800'
                      : 'bg-slate-100 text-slate-500 border-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700';

                    return `
                      <div class="p-4 sm:px-6 hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex-1 min-w-0 grid grid-cols-1 sm:grid-cols-2 gap-1 sm:gap-4 items-center">
                          <div class="font-bold text-base text-slate-900 dark:text-white truncate">
                            ${this.esc(w.en)}
                          </div>
                          <div class="text-sm text-slate-600 dark:text-slate-300 truncate">
                            ${this.esc(w.ja)}
                          </div>
                        </div>

                        <!-- Mastery Indicators & Actions -->
                        <div class="flex items-center justify-between sm:justify-end gap-3 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 dark:border-slate-800">
                          <div class="flex items-center gap-2 text-[11px] font-semibold">
                            <span class="px-2 py-0.5 rounded-md border ${badgeClass}" title="総合記憶度">
                              定着 ${avg}%
                            </span>
                            <span class="hidden md:inline text-slate-400 dark:text-slate-500" title="英→日: ${en2ja}% / 日→英: ${ja2en}%">
                              英→日 ${en2ja}%・日→英 ${ja2en}%
                            </span>
                          </div>

                          <div class="flex items-center gap-1">
                            <button onclick="app.openWordModal('${w.id}')" class="p-2 rounded-lg text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 transition-colors" title="編集">
                              <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button onclick="app.deleteWord('${w.id}')" class="p-2 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/50 transition-colors" title="削除">
                              <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      }

      bindBookViewEvents() {
        const searchInput = document.getElementById('word-search-input');
        if (searchInput) {
          searchInput.oninput = (e) => {
            this.searchQuery = e.target.value;
            // Re-render list smoothly while preserving cursor
            const pos = searchInput.selectionStart;
            this.render();
            const newInput = document.getElementById('word-search-input');
            if (newInput) {
              newInput.focus();
              newInput.setSelectionRange(pos, pos);
            }
          };
        }
      }

      // 3. MONOXER-STYLE TYPING STUDY VIEW
      renderStudyView() {
        const session = this.studySession;
        const book = this.getActiveBook();
        if (!session || !book) {
          this.navigate('home');
          return '';
        }

        // Session Complete Screen
        if (session.phase === 'complete') {
          const totalAnswered = session.history.length;
          const firstTryCorrect = session.history.filter(h => h.correct).length;
          const accuracy = totalAnswered ? Math.round((firstTryCorrect / totalAnswered) * 100) : 100;

          return `
            <div class="max-w-2xl mx-auto animate-pop">
              <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-10 border border-slate-200 dark:border-slate-800 shadow-xl text-center">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-500 text-white mx-auto flex items-center justify-center shadow-lg shadow-emerald-500/25 mb-5">
                  <i data-lucide="award" class="w-9 h-9"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mb-2">
                  トレーニング完了！
                </h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-8">
                  すべての筆記問題をクリアしました。記憶度がアップデートされました！
                </p>

                <!-- Result Stats -->
                <div class="grid grid-cols-3 gap-3 sm:gap-4 mb-8">
                  <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70">
                    <div class="text-xs font-bold text-slate-500 dark:text-slate-400">出題数</div>
                    <div class="text-2xl font-extrabold text-slate-900 dark:text-white mt-1">${totalAnswered}<span class="text-xs ml-0.5">問</span></div>
                  </div>
                  <div class="p-4 rounded-2xl bg-emerald-50/70 dark:bg-emerald-950/40">
                    <div class="text-xs font-bold text-emerald-700 dark:text-emerald-400">一発正解率</div>
                    <div class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">${accuracy}<span class="text-xs ml-0.5">%</span></div>
                  </div>
                  <div class="p-4 rounded-2xl bg-indigo-50/70 dark:bg-indigo-950/40">
                    <div class="text-xs font-bold text-indigo-700 dark:text-indigo-400">ブック定着率</div>
                    <div class="text-2xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-1">${this.getBookStats(book).overallPercent}<span class="text-xs ml-0.5">%</span></div>
                  </div>
                </div>

                <!-- Session Review List -->
                <div class="text-left mb-8">
                  <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">今回の学習結果</h3>
                  <div class="max-h-60 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800 rounded-2xl border border-slate-200 dark:border-slate-800">
                    ${session.history.map(item => `
                      <div class="px-4 py-3 flex items-center justify-between gap-3 text-sm bg-white dark:bg-slate-900">
                        <div class="min-w-0">
                          <div class="font-bold text-slate-900 dark:text-white truncate">${this.esc(item.en)}</div>
                          <div class="text-xs text-slate-500 dark:text-slate-400 truncate">${this.esc(item.ja)}</div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                          <span class="text-[11px] px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold">
                            ${item.dir === 'ja2en' ? '日→英' : '英→日'}
                          </span>
                          ${item.correct
                            ? `<span class="inline-flex items-center gap-1 text-xs font-bold text-emerald-600 dark:text-emerald-400"><i data-lucide="check-circle-2" class="w-4 h-4"></i>${item.usedHint ? 'ヒント正解' : '正解'}</span>`
                            : `<span class="inline-flex items-center gap-1 text-xs font-bold text-rose-500"><i data-lucide="refresh-cw" class="w-4 h-4"></i>復習クリア</span>`
                          }
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3">
                  <button onclick="app.navigate('book', '${book.id}')" class="flex-1 py-3.5 px-5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold text-sm transition-colors">
                    ブック詳細へ戻る
                  </button>
                  <button onclick="app.startStudySession('${session.directionMode}', '${session.scope}')" class="flex-1 py-3.5 px-5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md shadow-indigo-500/20 transition-colors">
                    続けてもう1セット学習
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        // Active Question Screen
        const currentItem = session.queue[session.currentIndex];
        const word = book.words.find(w => w.id === currentItem.wordId);
        const progressPercent = Math.round(((session.currentIndex) / session.queue.length) * 100);
        const isJaToEn = currentItem.dir === 'ja2en';
        const promptText = isJaToEn ? word.ja : word.en;
        const expectedAnswer = isJaToEn ? word.en : word.ja;
        const hintDisplay = this.getHintText(word, currentItem.dir, session.hintLevel);

        return `
          <div class="max-w-2xl mx-auto space-y-5 animate-pop">
            <!-- Top Progress Header -->
            <div class="flex items-center gap-4">
              <button onclick="app.navigate('book', '${book.id}')" class="p-2 rounded-xl text-slate-500 hover:bg-slate-200/70 dark:hover:bg-slate-800 transition-colors" title="学習を中断">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
              <div class="flex-1 h-3 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                <div style="width: ${progressPercent}%" class="h-full bg-gradient-to-r from-indigo-500 to-teal-500 transition-all duration-300"></div>
              </div>
              <span class="text-xs font-extrabold text-slate-600 dark:text-slate-300 tabular-nums">
                ${session.currentIndex + 1} / ${session.queue.length}
              </span>
            </div>

            <!-- Main Question Card -->
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-10 border border-slate-200/80 dark:border-slate-800 shadow-lg">
              <!-- Direction & Retry Badges -->
              <div class="flex items-center justify-between gap-2 mb-6">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${isJaToEn ? 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950/70 dark:text-indigo-300' : 'bg-teal-50 text-teal-700 dark:bg-teal-950/70 dark:text-teal-300'}">
                  <i data-lucide="${isJaToEn ? 'languages' : 'book-a'}" class="w-3.5 h-3.5"></i>
                  ${isJaToEn ? '日 → 英（スペルを筆記）' : '英 → 日（意味を筆記）'}
                </span>
                ${currentItem.isRetry ? `
                  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 dark:bg-amber-950/70 dark:text-amber-300">
                    <i data-lucide="refresh-cw" class="w-3 h-3"></i> リベンジ出題
                  </span>
                ` : ''}
              </div>

              <!-- Prompt Display -->
              <div class="text-center py-4 sm:py-6">
                <div class="text-xs font-semibold text-slate-400 dark:text-slate-500 mb-2">
                  ${isJaToEn ? '次の日本語に対応する英単語を入力してください' : '次の英単語の日本語訳を入力してください'}
                </div>
                <div class="${isJaToEn ? 'text-2xl sm:text-3xl' : 'text-3xl sm:text-5xl tracking-tight'} font-extrabold text-slate-900 dark:text-white break-words">
                  ${this.esc(promptText)}
                </div>

                <!-- Progressive Hint Display -->
                ${hintDisplay ? `
                  <div class="mt-5 inline-block px-4 py-2 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 text-amber-800 dark:text-amber-300 font-mono text-base sm:text-lg font-bold tracking-widest">
                    ヒント: ${this.esc(hintDisplay)}
                  </div>
                ` : ''}
              </div>

              <!-- Phase 1: Question Input Form -->
              ${session.phase === 'question' ? `
                <form id="study-question-form" class="mt-4 space-y-4">
                  <div class="relative">
                    <input type="text" id="study-answer-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                      placeholder="${isJaToEn ? '英単語をタイプ...' : '日本語の意味をタイプ...'}"
                      class="w-full px-5 py-4 rounded-2xl border-2 border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 text-center text-lg sm:text-xl font-bold text-slate-900 dark:text-white focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-800 outline-none transition-all" />
                  </div>

                  <div class="flex items-center gap-3">
                    <button type="button" onclick="app.useHint()" class="px-4 py-3.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-sm font-bold flex items-center gap-1.5 transition-colors" title="1文字ずつヒントを表示">
                      <i data-lucide="lightbulb" class="w-4 h-4 text-amber-500"></i> ヒント
                    </button>
                    <button type="submit" class="flex-1 py-3.5 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2 transition-all">
                      <span>解答する</span>
                      <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono bg-indigo-500 rounded">Enter</kbd>
                    </button>
                  </div>
                </form>
              ` : ''}

              <!-- Phase 2: Correct Feedback -->
              ${session.phase === 'feedback_correct' ? `
                <div class="mt-4 p-5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 text-center animate-pop">
                  <div class="inline-flex items-center gap-1.5 text-emerald-700 dark:text-emerald-400 font-extrabold text-lg mb-1">
                    <i data-lucide="check-circle-2" class="w-6 h-6"></i> 正解！
                  </div>
                  <div class="text-base font-bold text-slate-800 dark:text-slate-200 mt-1">
                    ${this.esc(word.en)} ＝ ${this.esc(word.ja)}
                  </div>
                  <button id="next-question-btn" class="mt-5 w-full py-3.5 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base shadow-md shadow-emerald-500/20 flex items-center justify-center gap-2">
                    <span>次の問題へ</span>
                    <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono bg-emerald-500 rounded">Enter</kbd>
                  </button>
                </div>
              ` : ''}

              <!-- Phase 3: Wrong Feedback + Monoxer Mandatory Retype Reinforcement -->
              ${session.phase === 'feedback_wrong' ? `
                <div class="mt-4 p-5 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/60 animate-pop">
                  <div class="flex items-center justify-center gap-1.5 text-rose-600 dark:text-rose-400 font-extrabold text-lg mb-3">
                    <i data-lucide="x-circle" class="w-6 h-6"></i> 不正解…
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-sm mb-4">
                    <div class="p-3 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-rose-200/70 dark:border-rose-900/60">
                      <div class="text-[11px] font-bold text-slate-400">あなたの解答</div>
                      <div class="font-bold text-rose-600 dark:text-rose-400 line-through mt-0.5 break-all">
                        ${session.lastUserAnswer ? this.esc(session.lastUserAnswer) : '（未入力）'}
                      </div>
                    </div>
                    <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-emerald-300 dark:border-emerald-800">
                      <div class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400">正しい答え</div>
                      <div class="font-extrabold text-slate-900 dark:text-white mt-0.5 break-all">
                        ${this.esc(expectedAnswer)}
                      </div>
                    </div>
                  </div>

                  <!-- Mandatory Retype Form to lock in muscle memory -->
                  <form id="study-retype-form" class="space-y-3">
                    <label class="block text-xs font-bold text-center text-rose-700 dark:text-rose-300">
                      記憶定着のため、正しい答えを1回タイピングして次へ進みましょう
                    </label>
                    <input type="text" id="study-retype-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                      placeholder="${this.esc(expectedAnswer.split(/[、,，/／・]/)[0].trim())}"
                      class="w-full px-4 py-3 rounded-xl border-2 border-rose-300 dark:border-rose-700 bg-white dark:bg-slate-900 text-center text-base font-bold text-slate-900 dark:text-white focus:border-indigo-500 outline-none" />
                    <button type="submit" class="w-full py-3 px-5 rounded-xl bg-slate-900 dark:bg-indigo-600 hover:bg-slate-800 dark:hover:bg-indigo-700 text-white font-bold text-sm">
                      打ち直しを確認して次へ
                    </button>
                  </form>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      bindStudyViewEvents() {
        const session = this.studySession;
        if (!session) return;

        if (session.phase === 'question') {
          const input = document.getElementById('study-answer-input');
          const form = document.getElementById('study-question-form');
          if (input) input.focus();
          if (form) {
            form.onsubmit = (e) => {
              e.preventDefault();
              this.submitStudyAnswer(input.value);
            };
          }
        } else if (session.phase === 'feedback_correct') {
          const nextBtn = document.getElementById('next-question-btn');
          if (nextBtn) {
            nextBtn.focus();
            nextBtn.onclick = () => this.advanceStudyQueue();
          }
        } else if (session.phase === 'feedback_wrong') {
          const retypeInput = document.getElementById('study-retype-input');
          const retypeForm = document.getElementById('study-retype-form');
          if (retypeInput) retypeInput.focus();
          if (retypeForm) {
            retypeForm.onsubmit = (e) => {
              e.preventDefault();
              this.submitStudyAnswer(retypeInput.value);
            };
          }
        }
      }
    }

    // Initialize Application
    const app = new MemoWriteApp();
  </script>
</body>
</html>
